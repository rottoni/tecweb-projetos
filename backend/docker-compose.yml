services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tecweb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ../frontend:/frontend   # Caminho correto: sobe um nível (..) e acha o frontend irmão
      - /app/node_modules
      - /app/node_modules/.prisma
    command: sh -c "npx prisma generate --schema=/app/prisma/schema.prisma && node src/server.js"

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tecweb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: