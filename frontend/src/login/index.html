<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - AR Bank</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <link rel="stylesheet" href="/src/global.css">
    <link rel="stylesheet" href="/src/login/style.css">
</head>
<body>
    <main class="container">
        <header>
            <section class="logo-wrapper">
                <img src="/assets/logo.png" alt="AR Bank" class="logo">
            </section>
        </header>
        <p class="text">Insira suas credenciais</p>     
        <form id="login-form" novalidate>
            <input type="email" id="emailDoUsuario" placeholder="Seu email aqui" required>
            <input type="password" id="senhaDoUsuario" placeholder="Sua senha aqui" required>
            <button type="submit" class="btn btn-login">Entrar</button>
        </form>
        <p class="text">Ou registre-se</p>
        <a href="/src/cadastro/index.html">
            <button id="go-to-register" class="btn btn-register" type="button">Criar nova conta</button>
        </a>
    </main>
    <script src="/src/login/script.js" defer></script>
</body>
</html>
