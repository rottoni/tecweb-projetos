<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - AR Bank</title>
    <link rel="stylesheet" href="/src/global.css">
    <link rel="stylesheet" href="/src/login/style.css">
</head>
<body>
    <main class="container">
        <header>
            <section class="logo-wrapper">
                <img src="/assets/logo.png" alt="AR Bank" class="logo">
            </section>
        </header>      
        <hr>
        <form id="login-form">
            <input type="text" id="username" placeholder="Usuário" required>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <hr>
        <a href="/src/cadastro/index.html">
            <button id="go-to-register" class="btn btn-secondary" type="button">Criar nova conta</button>
        </a>
        <hr>
    </main>
    <script src="/src/login/script.js" defer></script>
</body>
</html>
